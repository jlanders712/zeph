<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>LoRa Tracker</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root { --bg:#10151c; --panel:#18202b; --text:#e8edf3; --dim:#8b97a6; --accent:#ff5a36; --ok:#3ecf8e; --bad:#ff5a5a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:15px/1.35 system-ui, -apple-system, Roboto, sans-serif; }
  #cv, #map { position:absolute; inset:0; }
  #cv { touch-action:none; }
  #map { display:none; }
  .top { position:absolute; z-index:10; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px;
    display:flex; gap:8px; align-items:center; }
  .pill { background:var(--panel); border-radius:999px; padding:8px 14px; box-shadow:0 2px 8px #0006; }
  button { font:inherit; color:var(--text); background:var(--panel); border:0; border-radius:999px;
    padding:8px 14px; box-shadow:0 2px 8px #0006; }
  button.primary { background:var(--accent); color:#fff; font-weight:600; }
  button.on { outline:2px solid var(--accent); }
  .spacer { flex:1; }
  .side { position:absolute; z-index:10; right:10px; top:calc(max(10px, env(safe-area-inset-top)) + 54px);
    display:flex; flex-direction:column; gap:8px; }
  .side button { width:44px; height:44px; padding:0; font-size:20px; line-height:1; }
  .side button.small { font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.ok { background:var(--ok); }
  .panel { position:absolute; z-index:10; left:10px; right:10px; bottom:max(10px, env(safe-area-inset-bottom));
    background:var(--panel); border-radius:16px; padding:12px 14px; box-shadow:0 2px 12px #0008;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px 8px; }
  .stat .v { font-size:18px; font-weight:600; }
  .stat .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .stat.wide { grid-column: span 2; }
  .attr { grid-column:1 / -1; font-size:10px; color:var(--dim); display:none; }
  #arrow { display:inline-block; transition:transform .3s; }
  .stale { color:var(--bad); }
  #toast { position:absolute; z-index:20; left:50%; transform:translateX(-50%); top:calc(max(10px, env(safe-area-inset-top)) + 54px);
    background:var(--panel); padding:9px 14px; border-radius:12px; max-width:calc(100% - 90px); box-shadow:0 2px 12px #000a;
    display:none; font-size:14px; }
  @media (max-width:380px) { .panel { grid-template-columns:repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="cv"></canvas>

<div class="top">
  <div class="pill"><span class="dot" id="dot"></span><span id="status">Not connected</span></div>
  <div class="spacer"></div>
  <button id="connectBtn" class="primary">Connect</button>
</div>

<div class="side">
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <button id="fitBtn" class="small on">Fit</button>
  <button id="clearBtn" class="small">Clear</button>
  <button id="mapBtn" class="small">Map</button>
</div>
<input type="file" id="fileIn" multiple hidden>
<div id="toast"></div>

<div class="panel" id="panel">
  <div class="stat"><div class="v" id="dist">–</div><div class="l">Distance</div></div>
  <div class="stat"><div class="v"><span id="arrow">➤</span> <span id="brg">–</span></div><div class="l">Bearing</div></div>
  <div class="stat"><div class="v" id="spd">–</div><div class="l">Speed</div></div>
  <div class="stat"><div class="v" id="alt">–</div><div class="l">Altitude</div></div>
  <div class="stat"><div class="v" id="sats">–</div><div class="l">Satellites</div></div>
  <div class="stat"><div class="v" id="sig">–</div><div class="l">RSSI / SNR</div></div>
  <div class="stat wide"><div class="v" id="age">–</div><div class="l">Last update</div></div>
  <div class="attr" id="attrib">Map data © OpenStreetMap contributors · Protomaps · Terrain: Mapterhorn</div>
</div>

<script>
  window.__libErr = [];   // collects why a map library failed to load
  addEventListener('error', e => { if (e.filename && e.filename.includes('/lib/')) __libErr.push(e.filename.split('/').pop() + ': ' + e.message); });
</script>
<script src="lib/maplibre-gl.js" onerror="__libErr.push('maplibre-gl.js: file not found (404)')"></script>
<script src="lib/pmtiles.js" onerror="__libErr.push('pmtiles.js: file not found (404)')"></script>
<script>
// ---- must match config.h ----
const SERVICE = '8a1f0001-5b7c-4a52-9c3e-0d4b6f2e7a10';
const CHAR    = '8a1f0002-5b7c-4a52-9c3e-0d4b6f2e7a10';
const MAGIC   = 0xA5;

const $ = id => document.getElementById(id);
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const M_PER_DEG = rad(1) * R;
const TRAIL_KEY = 'loratrack.trail.v1', MAX_TRAIL = 3000;
const MONTANA = [[-116.05, 44.36], [-104.04, 49.00]];   // fallback view before a map file says otherwise

let me = null;            // {lat, lon, acc} phone position
let tracker = null;       // latest tracker packet
let trail = [];           // [{lat, lon}, ...]
let lastRx = 0, auto = true, mapMode = false;
const view = { cx: 0, cy: 0, scale: 1 };   // canvas view: centre in metres, pixels per metre

// ---------- small helpers ----------
let toastTimer = null;
function toast(msg, ms = 5000) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
}
function setManual() { auto = false; $('fitBtn').classList.remove('on'); }

// ---------- persistence (best effort) ----------
try {
  const saved = JSON.parse(localStorage.getItem(TRAIL_KEY) || '[]');
  if (Array.isArray(saved)) trail = saved.map(p => ({ lat: p[0], lon: p[1] }));
} catch (e) {}
function saveTrail() {
  try { localStorage.setItem(TRAIL_KEY, JSON.stringify(trail.map(p => [+p.lat.toFixed(6), +p.lon.toFixed(6)]))); } catch (e) {}
}

// map files live in IndexedDB so they survive restarts and work offline
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('loratrack', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return { get: k => tx('readonly', s => s.get(k)), put: (k, v) => tx('readwrite', s => s.put(v, k)) };
})();

// ---------- geometry ----------
function distance(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) -
            Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(2) + ' km';
function toXY(p, o) {   // local flat projection, metres east/north of origin o
  return { x: (p.lon - o.lon) * M_PER_DEG * Math.cos(rad(o.lat)), y: (p.lat - o.lat) * M_PER_DEG };
}
function niceStep(m) {
  const pow = Math.pow(10, Math.floor(Math.log10(m)));
  const f = m / pow;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
}
const fmtRing = m => m >= 1000 ? (m/1000) + ' km' : m + ' m';

// =====================================================================
//  Canvas view (no map file needed, no network)
// =====================================================================
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (mapMode && map) map.resize(); else draw();
}
addEventListener('resize', resize);

function draw() {
  if (mapMode) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#10151c'; ctx.fillRect(0, 0, W, H);

  const o = me || trail[0] || null;
  if (!o) {
    ctx.fillStyle = '#8b97a6'; ctx.font = '15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Waiting for a position…', W / 2, H / 2);
    return;
  }
  const top = 70, bottom = H - $('panel').offsetHeight - 24;
  const ah = Math.max(bottom - top, 100), midY = top + ah / 2;

  const pts = trail.map(p => toXY(p, o));
  const trk = tracker ? toXY(tracker, o) : null;
  const meXY = me ? { x: 0, y: 0 } : null;

  if (auto) {
    const all = pts.slice();
    if (meXY) all.push(meXY);
    let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    for (const p of all) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); }
    if (!all.length) { minx = maxx = miny = maxy = 0; }
    const ext = Math.max(maxx - minx, maxy - miny, 30);
    view.scale = Math.min(W - 60, ah - 40) / ext;
    view.cx = (minx + maxx) / 2; view.cy = (miny + maxy) / 2;
  }
  const sx = x => W / 2 + (x - view.cx) * view.scale;
  const sy = y => midY - (y - view.cy) * view.scale;
  const ox = sx(0), oy = sy(0);

  const step = niceStep(110 / view.scale);
  const maxR = Math.hypot(W, H);
  ctx.lineWidth = 1; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'left';
  for (let k = 1; k * step * view.scale < maxR && k < 60; k++) {
    const r = k * step * view.scale;
    ctx.strokeStyle = '#243040'; ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.stroke();
    const ly = oy - r - 4;
    if (ox > 0 && ox < W - 50 && ly > 60 && ly < bottom) { ctx.fillStyle = '#6f8096'; ctx.fillText(fmtRing(k * step), ox + 5, ly); }
  }
  ctx.strokeStyle = '#1c2633';
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();

  if (pts.length > 1) {
    ctx.strokeStyle = '#ff5a36'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y))); ctx.stroke();
  }
  if (trk && meXY) {
    ctx.setLineDash([6, 8]); ctx.strokeStyle = '#5aa9ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(sx(trk.x), sy(trk.y)); ctx.stroke(); ctx.setLineDash([]);
  }
  if (meXY) {
    if (me.acc) { ctx.fillStyle = '#2f80ff22'; ctx.beginPath(); ctx.arc(ox, oy, Math.max(me.acc * view.scale, 0), 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#2f80ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ox, oy, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  if (trk) {
    const tx = sx(trk.x), ty = sy(trk.y);
    ctx.fillStyle = '#ff5a36'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(tx, ty, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#8b97a6'; ctx.font = '600 13px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('N', 24, top + 12); ctx.fillText('↑', 24, top + 28);
}

let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
  setManual(); view.cx -= dx / view.scale; view.cy += dy / view.scale; draw();
});
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointercancel', () => drag = null);
cv.addEventListener('wheel', e => { e.preventDefault(); canvasZoom(e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
function canvasZoom(f) { setManual(); view.scale *= f; draw(); }

// =====================================================================
//  Offline map (MapLibre + PMTiles files kept in IndexedDB)
// =====================================================================
const haveLibs = () => typeof maplibregl !== 'undefined' && typeof pmtiles !== 'undefined';
function libProblem() {
  const st = [
    'maplibre-gl.js ' + (typeof maplibregl !== 'undefined' ? 'OK' : 'NOT loaded'),
    'pmtiles.js ' + (typeof pmtiles !== 'undefined' ? 'OK' : 'NOT loaded'),
  ].join(', ');
  return st + (window.__libErr && __libErr.length ? ' | ' + __libErr.join('; ') : '');
}
let map = null, mapReady = false, protocol = null, baseBounds = null;
const mapFiles = { base: null, terrain: null };

// Protomaps basemap colours (light, high-contrast for outdoor use)
const C = { land:'#eef0e6', forest:'#cfe3c4', grass:'#e1ecd0', scrub:'#dfe6c8', farm:'#f1eedb', ice:'#f4f8fb',
            barren:'#e9e2d0', urban:'#e4e2de', park:'#d3e8c6', water:'#a9cde8', none:'rgba(0,0,0,0)' };
const K  = ['coalesce', ['get', 'kind'], ['get', 'pmap:kind'], ''];   // schema v4+ uses "kind", older builds "pmap:kind"
const isPoly = ['==', ['geometry-type'], 'Polygon'];
const isLine = ['==', ['geometry-type'], 'LineString'];
const isPt   = ['==', ['geometry-type'], 'Point'];
const kinds  = list => ['match', K, list, true, false];
const zoomW  = (...stops) => ['interpolate', ['exponential', 1.5], ['zoom'], ...stops];

function glyphsUrl() { return new URL('.', location.href).href + 'fonts/{fontstack}/{range}.pbf'; }

function buildStyle(withTerrain) {
  const sources = {
    base:  { type: 'vector', url: 'pmtiles://base.pmtiles' },
    trail: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    link:  { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    trk:   { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    me:    { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
  };
  if (withTerrain) sources.terrain = { type: 'raster-dem', url: 'pmtiles://terrain.pmtiles', encoding: 'terrarium', tileSize: 512 };

  const L = [];
  L.push({ id: 'bg', type: 'background', paint: { 'background-color': C.land } });
  L.push({ id: 'landcover', type: 'fill', source: 'base', 'source-layer': 'landcover',
    paint: { 'fill-color': ['match', K, 'forest', C.forest, 'grassland', C.grass, 'scrub', C.scrub, 'farmland', C.farm,
                            'glacier', C.ice, 'barren', C.barren, 'urban_area', C.urban, C.none] } });
  L.push({ id: 'landuse', type: 'fill', source: 'base', 'source-layer': 'landuse', filter: isPoly,
    paint: { 'fill-color': ['match', K,
      ['park', 'national_park', 'nature_reserve', 'protected_area', 'forest', 'wood', 'recreation_ground'], C.park,
      ['industrial', 'commercial', 'retail', 'aerodrome', 'military'], '#e2dfda', C.none] } });
  L.push({ id: 'natural', type: 'fill', source: 'base', 'source-layer': 'natural', filter: isPoly,
    paint: { 'fill-color': ['match', K, ['wood', 'forest'], C.forest, ['scrub', 'heath', 'grassland'], C.scrub,
                            'glacier', C.ice, ['sand', 'beach'], '#f0e6c8', C.none] } });
  if (withTerrain) {
    L.push({ id: 'hillshade', type: 'hillshade', source: 'terrain',
      paint: { 'hillshade-exaggeration': 0.6, 'hillshade-shadow-color': '#4d463b',
               'hillshade-highlight-color': '#ffffff', 'hillshade-accent-color': '#6f6455' } });
  }
  L.push({ id: 'water', type: 'fill', source: 'base', 'source-layer': 'water', filter: isPoly, paint: { 'fill-color': C.water } });
  L.push({ id: 'waterway', type: 'line', source: 'base', 'source-layer': 'water', filter: isLine,
    paint: { 'line-color': C.water, 'line-width': zoomW(6, 0.5, 12, 1.3, 16, 4) } });
  L.push({ id: 'boundary-county', type: 'line', source: 'base', 'source-layer': 'boundaries', minzoom: 7,
    filter: kinds(['county']), paint: { 'line-color': '#b9a7cc', 'line-width': 0.8, 'line-dasharray': [2, 2] } });
  L.push({ id: 'boundary-region', type: 'line', source: 'base', 'source-layer': 'boundaries',
    filter: kinds(['region', 'macroregion']), paint: { 'line-color': '#8c6bb1', 'line-width': 1.3, 'line-dasharray': [4, 3] } });
  L.push({ id: 'boundary-country', type: 'line', source: 'base', 'source-layer': 'boundaries',
    filter: kinds(['country']), paint: { 'line-color': '#6a4c93', 'line-width': 1.8 } });

  const road = (id, kindList, color, widths, minzoom, extra = {}) => L.push({
    id, type: 'line', source: 'base', 'source-layer': 'roads', minzoom,
    filter: ['all', isLine, kinds(kindList)],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: Object.assign({ 'line-color': color, 'line-width': zoomW(...widths) }, extra) });
  road('rail',    ['rail'],                      '#7c7c7c', [8, 0.5, 14, 1.5], 8, { 'line-dasharray': [3, 2] });
  road('minor',   ['minor_road', 'other'],       '#8f8a80', [10, 0.4, 14, 1.5, 18, 6], 10);
  road('path',    ['path'],                      '#a0673a', [11, 0.6, 16, 1.6], 12, { 'line-dasharray': [2, 2] });
  road('medium',  ['medium_road'],               '#e6b94d', [8, 0.6, 12, 1.5, 16, 5, 18, 10], 8);
  road('major',   ['major_road'],                '#f2995a', [6, 0.7, 10, 1.6, 14, 4, 18, 12], 6);
  road('highway', ['highway'],                   '#e5563a', [4, 0.8, 8, 1.8, 12, 3.5, 16, 7, 18, 14], 4);

  const label = { 'text-font': ['Noto Sans Regular'], 'text-optional': true };
  L.push({ id: 'peak-dot', type: 'circle', source: 'base', 'source-layer': 'natural', minzoom: 9,
    filter: ['all', isPt, kinds(['peak', 'volcano'])],
    paint: { 'circle-radius': 3, 'circle-color': '#7a4a2a', 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } });
  L.push({ id: 'peak-name', type: 'symbol', source: 'base', 'source-layer': 'natural', minzoom: 10,
    filter: ['all', isPt, kinds(['peak', 'volcano'])],
    layout: Object.assign({}, label, { 'text-field': ['coalesce', ['get', 'name'], ''], 'text-size': 11, 'text-offset': [0, 0.9], 'text-anchor': 'top' }),
    paint: { 'text-color': '#5a3a22', 'text-halo-color': '#ffffff', 'text-halo-width': 1.4 } });
  L.push({ id: 'place-region', type: 'symbol', source: 'base', 'source-layer': 'places', maxzoom: 8,
    filter: kinds(['region', 'country']),
    layout: { 'text-font': ['Noto Sans Medium'], 'text-field': ['coalesce', ['get', 'name'], ''], 'text-size': 13,
              'text-transform': 'uppercase', 'text-letter-spacing': 0.12 },
    paint: { 'text-color': '#6d5a85', 'text-halo-color': '#ffffff', 'text-halo-width': 1.5 } });
  L.push({ id: 'place-locality', type: 'symbol', source: 'base', 'source-layer': 'places',
    filter: kinds(['locality']),
    layout: Object.assign({}, label, { 'text-field': ['coalesce', ['get', 'name'], ''],
      'text-size': ['interpolate', ['linear'], ['zoom'], 5, 10, 8, 12, 12, 15],
      'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population_rank'], 0]] }),
    paint: { 'text-color': '#2d2d2d', 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 } });

  // tracking overlays (always on top)
  L.push({ id: 'trail-line', type: 'line', source: 'trail', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ff5a36', 'line-width': 4, 'line-opacity': 0.9 } });
  L.push({ id: 'link-line', type: 'line', source: 'link',
    paint: { 'line-color': '#1f6fe0', 'line-width': 2, 'line-dasharray': [2, 2] } });
  L.push({ id: 'me-acc', type: 'circle', source: 'me',
    paint: { 'circle-radius': 0, 'circle-color': '#2f80ff', 'circle-opacity': 0.15 } });
  L.push({ id: 'me-dot', type: 'circle', source: 'me',
    paint: { 'circle-radius': 8, 'circle-color': '#2f80ff', 'circle-stroke-color': '#fff', 'circle-stroke-width': 3 } });
  L.push({ id: 'trk-dot', type: 'circle', source: 'trk',
    paint: { 'circle-radius': 10, 'circle-color': '#ff5a36', 'circle-stroke-color': '#fff', 'circle-stroke-width': 3 } });

  return { version: 8, glyphs: glyphsUrl(), sources, layers: L };
}

function ensureProtocol() {
  if (protocol) return;
  protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);
}
async function registerFile(kind) {
  const file = new File([mapFiles[kind]], kind + '.pmtiles');   // fixed name = the key used in pmtiles:// URLs
  const p = new pmtiles.PMTiles(new pmtiles.FileSource(file));
  protocol.add(p);
  return p.getHeader();
}

function setMapMode(on) {
  mapMode = on;
  $('map').style.display = on ? 'block' : 'none';
  cv.style.display = on ? 'none' : 'block';
  $('attrib').style.display = on ? 'block' : 'none';
  $('mapBtn').classList.toggle('on', on);
  if (on && map) map.resize(); else draw();
}

async function initMap() {
  if (map) { try { map.remove(); } catch (e) {} map = null; mapReady = false; }
  if (!haveLibs() || !mapFiles.base) { setMapMode(false); return; }
  try {
    ensureProtocol();
    const hb = await registerFile('base');
    baseBounds = [[hb.minLon, hb.minLat], [hb.maxLon, hb.maxLat]];
    const withTerrain = !!mapFiles.terrain;
    if (withTerrain) await registerFile('terrain');

    setMapMode(true);
    map = new maplibregl.Map({
      container: 'map', style: buildStyle(withTerrain), bounds: baseBounds,
      attributionControl: false, dragRotate: false, maxPitch: 0, fadeDuration: 0,
    });
    map.touchZoomRotate.disableRotation();
    map.on('load', () => { mapReady = true; updateMap(); });
    map.on('error', e => {
      const m = (e && e.error && e.error.message) || '';
      if (/glyph|\.pbf/i.test(m)) return;           // missing font ranges are harmless
      console.warn('map error', e.error || e);
      toast('Map error: ' + m.slice(0, 120), 7000);
    });
    const manual = e => { if (e && e.originalEvent) setManual(); };
    map.on('dragstart', manual); map.on('zoomstart', manual);
  } catch (e) {
    console.warn(e); setMapMode(false);
    toast('Could not open map file: ' + (e.message || e), 8000);
  }
}

const fc  = f => ({ type: 'FeatureCollection', features: f });
const ptF = p => ({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [p.lon, p.lat] } });
function updateMap() {
  if (!map || !mapReady) return;
  map.getSource('trail').setData(trail.length > 1
    ? fc([{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: trail.map(p => [p.lon, p.lat]) } }]) : fc([]));
  map.getSource('trk').setData(tracker ? fc([ptF(tracker)]) : fc([]));
  map.getSource('me').setData(me ? fc([ptF(me)]) : fc([]));
  map.getSource('link').setData(me && tracker
    ? fc([{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[me.lon, me.lat], [tracker.lon, tracker.lat]] } }]) : fc([]));
  if (me && me.acc) {   // accuracy circle: metres -> pixels at the current zoom
    const k = me.acc * 53.6 / Math.max(Math.cos(rad(me.lat)), 0.1);
    map.setPaintProperty('me-acc', 'circle-radius', ['interpolate', ['exponential', 2], ['zoom'], 0, 0, 22, k]);
  }
  if (auto) fitMap();
}
function fitMap() {
  if (!map || !mapReady) return;
  const pts = trail.map(p => [p.lon, p.lat]);
  if (me) pts.push([me.lon, me.lat]);
  if (tracker) pts.push([tracker.lon, tracker.lat]);
  if (!pts.length) { if (baseBounds) map.fitBounds(baseBounds, { padding: 20, duration: 0 }); return; }
  let [x0, y0, x1, y1] = [Infinity, Infinity, -Infinity, -Infinity];
  for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  map.fitBounds([[x0, y0], [x1, y1]], {
    padding: { top: 80, bottom: $('panel').offsetHeight + 30, left: 40, right: 70 }, maxZoom: 15, duration: 0 });
}

// ---------- loading .pmtiles files from the phone ----------
$('mapBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = async e => {
  const picked = Array.from(e.target.files || []); e.target.value = '';
  if (!picked.length) return;
  if (!haveLibs()) { toast('Map libraries missing: ' + libProblem(), 20000); return; }
  for (const f of picked) {
    let kind;
    try {
      const h = await new pmtiles.PMTiles(new pmtiles.FileSource(f)).getHeader();
      kind = h.tileType === 1 ? 'base' : 'terrain';   // 1 = vector tiles; image tiles = elevation
    } catch (err) { toast('Not a valid .pmtiles file: ' + f.name, 7000); continue; }
    toast('Saving ' + kind + ' map (' + Math.round(f.size / 1e6) + ' MB) for offline use…', 120000);
    try { await idb.put(kind, f); toast('Saved. This ' + kind + ' map now works offline.'); }
    catch (err) { toast('Could not save for offline use (' + (err && err.message || err) + '). Works until you close the page.', 9000); }
    mapFiles[kind] = f;
  }
  await initMap(); updateMap();
};

// ---------- phone's own position (works offline: it's the phone's GPS) ----------
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(pos => {
    me = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
    refresh();
  }, err => console.warn('geolocation', err.message), { enableHighAccuracy: true, maximumAge: 2000 });
}

function refresh() { refreshStats(); if (mapMode) updateMap(); else draw(); }

// ---------- buttons ----------
$('zoomIn').onclick  = () => { if (mapMode && map) { setManual(); map.zoomIn(); } else canvasZoom(1.5); };
$('zoomOut').onclick = () => { if (mapMode && map) { setManual(); map.zoomOut(); } else canvasZoom(1 / 1.5); };
$('fitBtn').onclick  = () => { auto = true; $('fitBtn').classList.add('on'); if (mapMode) fitMap(); else draw(); };
$('clearBtn').onclick = () => {
  if (!confirm('Clear the saved track?')) return;
  trail = tracker ? [{ lat: tracker.lat, lon: tracker.lon }] : []; saveTrail(); refresh();
};

// ---------- packet handling ----------
function handlePacket(dv) {
  if (dv.byteLength < 18 || dv.getUint8(0) !== MAGIC) return;
  const le = true;
  const p = {
    node: dv.getUint8(1),
    seq:  dv.getUint16(2, le),
    lat:  dv.getInt32(4, le) / 1e7,
    lon:  dv.getInt32(8, le) / 1e7,
    alt:  dv.getInt16(12, le),
    spd:  dv.getUint8(14),
    sats: dv.getUint8(15) & 0x7f,
    fix:  !!(dv.getUint8(15) & 0x80),
    rssi: dv.getInt8(16),
    snr:  dv.getInt8(17),
  };
  lastRx = Date.now();
  $('sats').textContent = p.sats;
  $('sig').textContent = p.rssi + ' / ' + p.snr;
  if (!p.fix) { $('status').textContent = 'Tracker has no GPS fix'; return; }

  $('status').textContent = 'Tracking #' + p.node;
  tracker = p;
  const last = trail[trail.length - 1];
  if (!last || distance(last, p) >= 2) {            // skip points closer than 2 m
    trail.push({ lat: p.lat, lon: p.lon });
    if (trail.length > MAX_TRAIL) trail.shift();
    saveTrail();
  }
  $('spd').textContent = p.spd + ' km/h';
  $('alt').textContent = p.alt + ' m';
  refresh();
}

function refreshStats() {
  if (tracker && me) {
    $('dist').textContent = fmtDist(distance(me, tracker));
    const b = bearing(me, tracker);
    $('brg').textContent = Math.round(b) + '°';
    $('arrow').style.transform = 'rotate(' + (b - 90) + 'deg)';   // ➤ points east at 0deg
  }
}
setInterval(() => {
  if (!lastRx) return;
  const s = Math.round((Date.now() - lastRx) / 1000);
  const el = $('age');
  el.textContent = s < 60 ? s + ' s ago' : Math.floor(s/60) + ' min ago';
  el.className = 'v' + (s > 30 ? ' stale' : '');
}, 1000);

// ---------- Bluetooth ----------
let device = null;
function setConn(ok, text) { $('dot').className = 'dot' + (ok ? ' ok' : ''); $('status').textContent = text; }

async function connectGatt() {
  setConn(false, 'Connecting…');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  const chr = await svc.getCharacteristic(CHAR);
  chr.addEventListener('characteristicvaluechanged', e => handlePacket(e.target.value));
  await chr.startNotifications();
  setConn(true, 'Connected, waiting for tracker…');
  try { handlePacket(await chr.readValue()); } catch (e) {}
}

async function onDisconnected() {
  setConn(false, 'Disconnected, retrying…');
  for (let i = 0; i < 5 && device && !device.gatt.connected; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try { await connectGatt(); return; } catch (e) { /* retry */ }
  }
  if (!device.gatt.connected) setConn(false, 'Disconnected');
}

$('connectBtn').onclick = async () => {
  if (!navigator.bluetooth) { alert('Web Bluetooth needs Chrome on Android, on a page served over HTTPS.'); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    await connectGatt();
  } catch (e) { setConn(false, e.name === 'NotFoundError' ? 'Not connected' : 'Error: ' + e.message); }
};

// ---------- offline caching (needs one visit over HTTPS first) ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ---------- start ----------
(async function start() {
  resize();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}  // ask browser not to evict the map
  if (!haveLibs()) { toast('Map libraries not loaded: ' + libProblem(), 20000); return; }   // canvas view only
  try {
    mapFiles.base = (await idb.get('base')) || null;
    mapFiles.terrain = (await idb.get('terrain')) || null;
  } catch (e) { console.warn('IndexedDB unavailable', e); }
  await initMap();
  if (mapMode) updateMap();
})();
</script>
</body>
</html>
